name: Build Android APK
on:
  push:
    branches: [main]
    paths-ignore: ['.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Set signing paths
        run: |
          printf 'PHISCRIPT_DEBUG_KEYSTORE=%s/phiscript-signing/debug.keystore\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'SIGNING_STATE_DIR=%s/phiscript-signing-state\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare preinstalled Android SDK
        timeout-minutes: 5
        run: |
          test -n "$ANDROID_HOME"
          sdk_manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdk_manager"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            "$sdk_manager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Restore debug signing identity
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PHISCRIPT_DEBUG_KEYSTORE }}
          key: phiscript-debug-key-v2
      - name: Validate signing identity before building
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > published-releases.json
          python3 .github/scripts/signing.py prepare
      - name: Preserve validated debug signing identity
        if: steps.signing-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PHISCRIPT_DEBUG_KEYSTORE }}
          key: phiscript-debug-key-v2
      - name: Test, lint and build
        run: gradle --no-daemon --no-build-cache testDebugUnitTest lintDebug assembleDebug
      - name: Verify built APK signing identity
        run: python3 .github/scripts/signing.py verify
      - name: Summarize unit tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
          assert reports, "No unit test reports"
          totals = {key: 0 for key in ("tests", "failures", "errors", "skipped")}
          for report in reports:
              suite = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, "0"))
          print("Unit test totals: " + str(totals))
          assert totals["failures"] == 0 and totals["errors"] == 0
          PY
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Phigros-Script-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
