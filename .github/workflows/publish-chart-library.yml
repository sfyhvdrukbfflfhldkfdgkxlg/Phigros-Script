name: Publish the 2026-11-20 Phigros chart library
on:
  push:
    branches: [publish/charts-4.0.1.2-20261120]
  create:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chart-library-4.0.1.2-20261120
  cancel-in-progress: false
jobs:
  library:
    if: github.repository == 'sfyhvdrukbfflfhldkfdgkxlg/Phigros-Script' && github.ref == 'refs/heads/publish/charts-4.0.1.2-20261120'
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.7'
          architecture: x64
      - name: Build the complete chart library from pinned source files
        shell: pwsh
        run: |
          python chart-libraries/2026-11-20/build_chart_library.py --assets updates/data1.0.9-r15/patch/assets/phigros-swordalt-catalog-v1.json --cache "$env:RUNNER_TEMP/chart-inputs" --output "$env:RUNNER_TEMP/Phigros_Charts_4.0.1.2_20261120.zip"
      - name: Verify and publish the chart archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: python chart-libraries/2026-11-20/publish.py "$env:RUNNER_TEMP/Phigros_Charts_4.0.1.2_20261120.zip"
