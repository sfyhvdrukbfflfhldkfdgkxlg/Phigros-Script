name: Publish verified data1.1.3-r2
on:
  push:
    branches: [main]
    paths:
      - updates/data1.1.3-r2/release-data/manifest.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-data-1-1-3-r2
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'sfyhvdrukbfflfhldkfdgkxlg/Phigros-Script' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Restore and publish the verified APK and source
        run: |
          gh release download data1.0.9-r15 --repo "$GITHUB_REPOSITORY" --pattern PhigrosScript_data1.0.9-r15.apk --dir "$RUNNER_TEMP/base"
          python3 .github/scripts/publish_data113.py "$RUNNER_TEMP/dist" "$RUNNER_TEMP/base/PhigrosScript_data1.0.9-r15.apk" data1.1.3-r2
