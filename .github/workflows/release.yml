name: Publish v0.1.6 Alpha APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-v0.1.6-ubuntu22
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_RUN: '37505782279'
      SOURCE_SHA: '2f7308be00479b9117d2627a6a9f207f8b15216a'
      ARTIFACT_ID: '11432455506'
      ARCHIVE_SHA256: d7f89e66157cba9073db11103ea563002580924f6e5d0ebb1a47b1078c777e3c
      RELEASE_TAG: v0.1.6
      TEST_COUNT: '252'
    steps:
      - name: Verify publication inputs are ready
        run: |
          python3 - <<'PY'
          import os, re
          for name in ("SOURCE_RUN", "ARTIFACT_ID", "TEST_COUNT"):
              assert re.fullmatch(r"[1-9][0-9]*", os.environ[name]), name + " is not ready"
          assert re.fullmatch(r"[0-9a-f]{40}", os.environ["SOURCE_SHA"]), "SOURCE_SHA is not ready"
          assert re.fullmatch(r"[0-9a-f]{64}", os.environ["ARCHIVE_SHA256"]), "ARCHIVE_SHA256 is not ready"
          PY
      - name: Verify tested build and unused release tag
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > source-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" > existing-tags.json
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > existing-releases.json
          gh api "repos/$GITHUB_REPOSITORY/git/trees/$SOURCE_SHA?recursive=1" > tested-tree.json
          gh api "repos/$GITHUB_REPOSITORY/git/trees/$GITHUB_SHA?recursive=1" > release-tree.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" > current-main.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          def read(name):
              return json.loads(Path(name).read_text())
          run = read("source-run.json")
          artifact = read("source-artifact.json")
          assert run["repository"]["full_name"] == os.environ["GITHUB_REPOSITORY"]
          assert run["id"] == int(os.environ["SOURCE_RUN"])
          assert run["head_sha"] == os.environ["SOURCE_SHA"]
          assert run["head_branch"] == "main" and run["event"] == "push"
          assert run["path"] == ".github/workflows/android.yml"
          assert run["status"] == "completed" and run["conclusion"] == "success"
          assert artifact["id"] == int(os.environ["ARTIFACT_ID"])
          assert artifact["name"] == "Phigros-Script-debug" and not artifact["expired"]
          assert artifact["workflow_run"]["id"] == run["id"]
          assert artifact["workflow_run"]["head_sha"] == run["head_sha"]
          assert artifact["digest"] == "sha256:" + os.environ["ARCHIVE_SHA256"]
          tag = os.environ["RELEASE_TAG"]
          assert all(x["ref"] != "refs/tags/" + tag for x in read("existing-tags.json")), "Tag already exists"
          assert all(x["tag_name"] != tag for x in read("existing-releases.json")), "Release already exists"
          tested_tree = read("tested-tree.json")
          release_tree = read("release-tree.json")
          assert tested_tree["truncated"] is False and release_tree["truncated"] is False
          def build_inputs(tree):
              return {x["path"]: (x["type"], x["mode"], x["sha"]) for x in tree["tree"]
                      if x["type"] != "tree" and x["path"] != ".github/workflows/release.yml"}
          assert build_inputs(tested_tree) == build_inputs(release_tree), "Build inputs differ from tested source"
          assert read("current-main.json")["object"]["sha"] == os.environ["GITHUB_SHA"], "Main advanced; stop publication"
          print("Verified successful build, exact artifact, unchanged build inputs and unused tag.")
          PY
      - name: Download and verify original APK
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > artifact.zip
          printf '%s  %s\n' "$ARCHIVE_SHA256" artifact.zip | sha256sum --check -
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          output = Path("dist")
          output.mkdir()
          with ZipFile("artifact.zip") as archive:
              files = [x for x in archive.infolist() if not x.is_dir()]
              assert len(files) == 1 and files[0].filename == "app-debug.apk"
              assert 0 < files[0].file_size <= 128 * 1024 * 1024
              apk = archive.read(files[0])
          target = output / "Phigros-Script-v0.1.6.apk"
          target.write_bytes(apk)
          with ZipFile(target) as package:
              assert "AndroidManifest.xml" in package.namelist()
              assert "classes.dex" in package.namelist()
          print("Verified original APK archive.")
          PY
          cd dist
          sha256sum Phigros-Script-v0.1.6.apk > SHA256SUMS.txt
      - name: Inspect update signing identity
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > signing-releases.json
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          root = Path(os.environ.get("ANDROID_HOME", "/usr/local/lib/android/sdk"))
          candidates = sorted(root.glob("build-tools/*/apksigner"), reverse=True)
          assert candidates, "apksigner unavailable; refusing unverified publication"
          def certificate(path):
              result = subprocess.run([str(candidates[0]), "verify", "--print-certs", str(path)],
                                      capture_output=True, text=True, timeout=30, check=True)
              fingerprints = re.findall(r"(?im)^(?:V[\d.]+ )?Signer[^\n]*?certificate SHA-256 digest:\s*([0-9a-f]{64})\s*$", result.stdout)
              assert fingerprints, "APK signer certificate not found"
              return {x.lower() for x in fingerprints}
          versions = []
          for page in json.loads(Path("signing-releases.json").read_text()):
              for release in page:
                  match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", release["tag_name"])
                  if not release["draft"] and match:
                      versions.append((tuple(map(int, match.groups())), release))
          assert versions, "No previous release for signing comparison"
          previous_version, previous = max(versions, key=lambda x: x[0])
          assert previous_version >= (0, 1, 3), "Stable v0.1.3-or-later signing anchor missing"
          tag = previous["tag_name"]
          old_name = "Phigros-Script-" + tag + ".apk"
          assert len([a for a in previous["assets"] if a["name"] == old_name and a["state"] == "uploaded"]) == 1
          Path("previous").mkdir()
          subprocess.run(["gh", "release", "download", tag, "--repo", os.environ["GITHUB_REPOSITORY"],
                          "--pattern", old_name, "--dir", "previous"], check=True, timeout=90)
          old = certificate(Path("previous") / old_name)
          new = certificate("dist/Phigros-Script-v0.1.6.apk")
          # This is a permanent migration boundary, not the next release's version.
          migration_allowed = os.environ["RELEASE_TAG"] == "v0.1.3" and previous_version < (0, 1, 3)
          assert old == new or migration_allowed, "Unexpected signing change; refusing publication"
          if old == new:
              note = "\n已核对：此 APK 与 " + tag + " 签名一致，可尝试覆盖安装。\n"
              print("SIGNING_COMPARISON=match")
          else:
              note = "\n**安装说明：本次迁移到固定的 CI 调试签名，与 " + tag + " 不同，无法覆盖安装。请先保存校准和曲名别名，再卸载旧版、安装新版并重新授权。卸载会清除本应用设置与诊断。后续构建若签名缓存丢失或证书变化将停止，不会静默改签名发布。**\n"
              print("SIGNING_COMPARISON=approved-v0.1.3-migration")
          Path("signing-note.md").write_text(note)
          print("New APK signer SHA256: " + ",".join(sorted(new)))
          PY
      - name: Create draft and upload APK
        run: |
          cat > release-notes.md <<'NOTES'
          ## Phigros Script v0.1.6 Alpha（纯视觉 / Phira 谱面）

          下载 **Phigros-Script-v0.1.6.apk** 安装，可覆盖 v0.1.3–v0.1.5。

          - 移除音符与谱面的视觉时间拟合。
          - 新增 Phigros 纯视觉模式：无需谱库或曲名识别，检测可见判定线与四类音符，悬浮窗确认后直接演奏；不自动暂停校准。
          - 新增 Phira 谱面包本地导入：PEZ / ZIP / PGR v1/v3 JSON / 支持的基础 RPE JSON。匹配曲名与自定义难度后，由中央重试建立演奏时钟。
          - Phira 默认按居中 16:9 视口处理长屏手机，可关闭自动视口后手动校准。请使用 1 倍速、关闭镜像，填写相同的游戏全局偏移。
          - 保留只识别模式、悬浮窗确认、通知栏 / 音量减停止，以及 Shizuku 与 Phigros APK 工具。

          纯视觉受皮肤、遮挡、复杂判定线和截图 / 触控延迟影响；Phira 高级非线性事件、父子线、非默认控件、PEC / PBC 暂不支持。Phira 私有下载目录无法直接读取，请导入导出的谱面包。重试后验证界面可能跳过过早的开头音符。未在 vivo V2505A / Android 17 真机验证，不能保证全连或 AP。

          252 项单元测试、Android lint、APK 构建和签名校验通过。构建：[37505782279](https://github.com/sfyhvdrukbfflfhldkfdgkxlg/Phigros-Script/actions/runs/37505782279)，源码 2f7308be00479b9117d2627a6a9f207f8b15216a。发布工作流以外文件与已验证构建逐项核对一致。SHA256SUMS.txt 可校验 APK 下载。

          使用调试签名，Alpha 预发布。v0.1.2 及更早版本需先记录设置，卸载后重新安装。签名核对结果如下。
          NOTES
          cat signing-note.md >> release-notes.md
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Phigros Script v0.1.6 Alpha" \
            --notes-file release-notes.md \
            --draft --prerelease
          gh release upload "$RELEASE_TAG" \
            dist/Phigros-Script-v0.1.6.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY"
      - name: Verify assets and publish
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > uploaded-releases.json
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          releases = json.loads(Path("uploaded-releases.json").read_text())
          matches = [x for x in releases if x["tag_name"] == os.environ["RELEASE_TAG"]]
          assert len(matches) == 1
          release = matches[0]
          assert release["draft"] and release["prerelease"]
          assert release["target_commitish"] == os.environ["GITHUB_SHA"]
          assets = {x["name"]: x for x in release["assets"]}
          expected = {"Phigros-Script-v0.1.6.apk", "SHA256SUMS.txt"}
          assert set(assets) == expected
          for name in expected:
              asset = assets[name]
              source = Path("dist") / name
              assert asset["state"] == "uploaded"
              assert asset["size"] == source.stat().st_size
              assert asset["digest"] == "sha256:" + hashlib.sha256(source.read_bytes()).hexdigest()
          print("Both release assets verified.")
          PY
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > published-tag.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          tag = json.loads(Path("published-tag.json").read_text())
          assert tag["object"]["type"] == "commit"
          assert tag["object"]["sha"] == os.environ["GITHUB_SHA"]
          print("Published tag contains the verified build inputs and publication workflow.")
          PY
